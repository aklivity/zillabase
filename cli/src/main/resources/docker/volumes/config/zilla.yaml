---
name: zillabase-config-server
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    routes:
      - when:
          - headers:
              :scheme: http
              :authority: config.zillabase.dev:7114
        exit: north_http_kafka_mapping
  north_http_kafka_mapping:
    type: http-kafka
    kind: proxy
    routes:
      - when:
          - method: PUT
            path: /config/{id}
        exit: north_kafka_cache_client
        with:
          capability: produce
          topic: _zillabase.config
          key: ${params.id}
      - when:
          - method: GET
            path: /config/{id}
        exit: north_kafka_cache_client
        with:
          capability: fetch
          topic: _zillabase.config
          filters:
            - key: ${params.id}
      - when:
          - method: DELETE
            path: /config/{id}
        exit: north_kafka_cache_client
        with:
          capability: produce
          topic: _zillabase.config
          key: ${params.id}
  north_kafka_cache_client:
    type: kafka
    kind: cache_client
    exit: south_kafka_cache_server
  south_kafka_cache_server:
    type: kafka
    kind: cache_server
    options:
      bootstrap:
        - _zillabase.config
    exit: south_kafka_client
  south_kafka_client:
    type: kafka
    kind: client
    options:
      servers:
        - ${{env.KAFKA_BOOTSTRAP_SERVER}}
    exit: south_tcp_client
  south_tcp_client:
    type: tcp
    kind: client
telemetry:
  exporters:
    stdout_logs_exporter:
      type: stdout
