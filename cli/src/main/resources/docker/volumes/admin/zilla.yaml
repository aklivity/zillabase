---
name: admin
catalogs:
  karapace_catalog:
    type: karapace
    options:
      url: ${{env.KARAPACE_URL}}
bindings:
  tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 4567
        - 7184
    routes:
      - when:
          - port: 4567
        exit: pgsql_server
      - when:
          - port: 7184
        exit: http_server
  pgsql_server:
    type: pgsql
    kind: server
    exit: risingwave_proxy
  risingwave_proxy:
    type: risingwave
    kind: proxy
    options:
      kafka:
        properties:
          bootstrap.server: ${{env.KAFKA_BOOTSTRAP_SERVER}}
        format:
          model: avro
          catalog:
            karapace_catalog:
              - strategy: topic
      udf:
        - server: ${{env.JAVA_UDF_SERVER_URL}}
        - server: ${{env.PYTHON_UDF_SERVER_URL}}
          language: python
    routes:
      - exit: pgsql_kafka_proxy
        when:
          - commands:
              - "CREATE TOPIC"
              - "ALTER TOPIC"
              - "DROP TOPIC"
    exit: pgsql_client
  pgsql_client:
    type: pgsql
    kind: client
    exit: pgsql_tcp_client
  pgsql_tcp_client:
    type: tcp
    kind: client
    options:
      host: ${{env.RISINGWAVE_HOST}}
      port: ${{env.RISINGWAVE_PORT}}
  pgsql_kafka_proxy:
    type: pgsql-kafka
    kind: proxy
    catalog:
      karapace_catalog:
        - strategy: topic
    exit: kafka_client
  kafka_client:
    type: kafka
    kind: client
    options:
      servers:
        - ${{env.KAFKA_BOOTSTRAP_SERVER}}
    exit: kafka_tcp_client
  kafka_tcp_client:
    type: tcp
    kind: client
  http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              upgrade: websocket
        exit: ws_server
      - when:
        - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/udf/python
        with:
          headers:
            overrides:
              :authority: ${{env.PYTHON_UDF_SERVER_HOST}}:${{env.PYTHON_UDF_SERVER_PORT}}
              :path: /python/functions
        exit: python_udf_http_client
      - when:
        - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/udf/java
        with:
          headers:
            overrides:
              :authority: ${{env.JAVA_UDF_SERVER_HOST}}:${{env.JAVA_UDF_SERVER_PORT}}
              :path: /java/functions
        exit: java_udf_http_client
      - when:
          - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/config/{id}
        with:
          headers:
            overrides:
              :authority: ${{env.CONFIG_SERVER_HOST}}:${{env.CONFIG_SERVER_PORT}}
              :path: /config/${params.id}
        exit: config_http_client
      - when:
          - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/asyncapis
        with:
          headers:
            overrides:
              :authority: ${{env.APICURIO_HOST}}:${{env.APICURIO_PORT}}
              :path: /apis/registry/v2/groups/${{env.APICURIO_GROUP_ID}}/artifacts
              x-registry-artifacttype: ASYNCAPI
        exit: apicurio_http_client
      - when:
          - headers:
              :method: GET
              :scheme: http
              :authority: localhost:7184
              :path: /v1/asyncapis/{id}
        with:
          headers:
            overrides:
              :authority: ${{env.APICURIO_HOST}}:${{env.APICURIO_PORT}}
              :path: /apis/registry/v2/groups/${{env.APICURIO_GROUP_ID}}/artifacts/${params.id}
        exit: apicurio_http_client
      - when:
          - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/auth/sso/providers
        with:
          headers:
            overrides:
              :authority: ${{env.AUTH_HOST}}:${{env.AUTH_PORT}}
        exit: auth_http_client
      - when:
          - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/auth/sso/providers/*
        with:
          headers:
            overrides:
              :authority: ${{env.AUTH_HOST}}:${{env.AUTH_PORT}}
        exit: auth_http_client
      - when:
          - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/auth/users
        with:
          headers:
            overrides:
              :authority: ${{env.AUTH_HOST}}:${{env.AUTH_PORT}}
        exit: auth_http_client
      - when:
          - headers:
              :scheme: http
              :authority: localhost:7184
              :path: /v1/auth/users/*
        with:
          headers:
            overrides:
              :authority: ${{env.AUTH_HOST}}:${{env.AUTH_PORT}}
        exit: auth_http_client
      - when:
          - headers:
              :path: /v1/snippets
        exit: http_filesystem_proxy
      - when:
          - headers:
              :path: /v1/snippets/*
        exit: http_filesystem_proxy
      - when:
          - headers:
              :path: /v1/storage/*
        exit: http_filesystem_proxy
  config_http_client:
    type: http
    kind: client
    exit: config_tcp_client
  config_tcp_client:
    type: tcp
    kind: client
    options:
      host: ${{env.CONFIG_SERVER_HOST}}
      port: ${{env.CONFIG_SERVER_PORT}}
  python_udf_http_client:
    type: http
    kind: client
    exit: python_udf_tcp_client
  python_udf_tcp_client:
    type: tcp
    kind: client
    options:
      host: ${{env.PYTHON_UDF_SERVER_HOST}}
      port: ${{env.PYTHON_UDF_SERVER_PORT}}
  java_udf_http_client:
    type: http
    kind: client
    exit: java_udf_tcp_client
  java_udf_tcp_client:
    type: tcp
    kind: client
    options:
      host: ${{env.JAVA_UDF_SERVER_HOST}}
      port: ${{env.JAVA_UDF_SERVER_PORT}}
  apicurio_http_client:
    type: http
    kind: client
    exit: apicurio_tcp_client
  apicurio_tcp_client:
    type: tcp
    kind: client
    options:
      host: ${{env.APICURIO_HOST}}
      port: ${{env.APICURIO_PORT}}
  auth_http_client:
    type: http
    kind: client
    exit: auth_tcp_client
  auth_tcp_client:
    type: tcp
    kind: client
    options:
      host: ${{env.AUTH_HOST}}
      port: ${{env.AUTH_PORT}}
  http_filesystem_proxy:
    type: http-filesystem
    kind: proxy
    routes:
      - when:
          - method: GET
            path: /v1/storage/buckets
          - method: POST
            path: /v1/storage/buckets/{bucket}
          - method: DELETE
            path: /v1/storage/buckets/{bucket}
        exit: storage_filesystem_server
        with:
          directory: ${params.bucket}
      - when:
          - method: GET
            path: /v1/storage/objects/{bucket}/{path}
          - method: GET
            path: /v1/storage/objects/{bucket}
          - method: POST
            path: /v1/storage/objects/{bucket}/{path}
          - method: PUT
            path: /v1/storage/objects/{bucket}/{path}
          - method: DELETE
            path: /v1/storage/objects/{bucket}/{path}
        exit: storage_filesystem_server
        with:
          directory: ${params.bucket}
          path: ${params.path}
      - when:
          - method: GET
            path: /v1/snippets
          - method: GET
            path: /v1/snippets/{path}
          - method: GET
            path: /v1/snippets/
          - method: POST
            path: /v1/snippets/{path}
          - method: PUT
            path: /v1/snippets/{path}
          - method: DELETE
            path: /v1/snippets/{path}
        exit: snippet_filesystem_server
        with:
          path: ${params.path}
  ws_server:
    type: ws
    kind: server
    exit: pgsql_server
  storage_filesystem_server:
    type: filesystem
    kind: server
    options:
      location: /var/storage/
  snippet_filesystem_server:
    type: filesystem
    kind: server
    options:
      location: /var/snippets/
telemetry:
  exporters:
    stdout_logs_exporter:
      type: stdout
